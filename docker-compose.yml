version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ojt_monitoring_db
      POSTGRES_USER: ojt_admin
      POSTGRES_PASSWORD: ojt_admin_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ojt_admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      SECRET_KEY: "dev-secret-key-change-in-production"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ojt_monitoring_db
      DB_USER: ojt_admin
      DB_PASSWORD: ojt_admin_password
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
