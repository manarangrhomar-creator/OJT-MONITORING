<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OJT Coordinator Register - ISU</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght=600;700&family=Inter:wght=400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@0.344.0"></script>
    <style>
        .custom-heading { font-family: 'Fredoka', sans-serif; }
        .custom-btn { font-family: 'Inter', sans-serif; }
        body {
            /* Heto na ang direct link ng bago mong napiling green bamboo wallpaper background */
            background-image: url('https://static.vecteezy.com/system/resources/previews/027/177/798/original/jungle-bamboo-tropical-background-vector.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
    </style>
</head>
<body class="bg-emerald-50/50 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-4xl bg-white rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col md:flex-row-reverse min-h-[550px]">
        
        <div class="w-full md:w-[40%] bg-[#11693A] flex flex-col items-center justify-center p-10 text-white">
           <div class="w-60 h-60 flex items-center justify-center">
                <img src="https://www.eduopinions.com/wp-content/uploads/2023/09/ISU-SEAL-DOWNSCALE-350x345.png"
                     alt="ISU Logo" 
                     class="w-full h-full object-contain">
            </div>
            <p class="custom-text mb-4 font-medium italic opacity-90 text-sm text-center">Already have an account?</p>
            <a href="{% url 'login' %}" class="w-full max-w-[200px] border-2 border-white rounded-full py-2 px-6 font-bold hover:bg-white hover:text-[#11693A] transition-all duration-300 text-center">
                Login
            </a>
            <p class="custom-text mt-4 mb-2 font-medium italic opacity-90 text-sm text-center">Register as a Student instead?</p>
            <a href="{% url 'student-register' %}" class="w-full max-w-[200px] border-2 border-white rounded-full py-2 px-6 font-bold hover:bg-white hover:text-[#11693A] transition-all duration-300 text-center">
                Student
            </a>
        </div>

        <div class="w-full md:w-[60%] p-8 md:p-12 relative flex flex-col justify-center">
            
            <button id="backBtn" onclick="window.location.href='/'" class="absolute top-8 left-8 w-10 h-10 flex items-center justify-center rounded-full border border-gray-200 hover:bg-gray-100 transition-all shadow-sm text-[#11693A]">
                <i data-lucide="chevron-left" class="w-5 h-5"></i>
            </button>
            
            <div class="max-w-md mx-auto w-full">
                <h1 class="custom-heading text-[#11693A] text-4xl font-bold text-center mb-6 leading-tight">OJT Coordinator</h1>
                
                <form class="space-y-4" id="regForm" onsubmit="handleFormSubmit(event)">
                    
                    <div id="step1" class="space-y-4">
                        <div>
                            <label class="custom-heading text-[#11693A] text-lg block mb-1">Full Name</label>
                            <input type="text" id="fullName" required placeholder="Last Name, First Name, M.I., Suffix" pattern="[A-Za-z\s,.]+" title="Full name should only contain letters, spaces, commas, and periods" oninput="this.value = this.value.replace(/[^A-Za-z\s,.]/g, '')" class="w-full border-4 border-[#11693A] rounded-xl p-2 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all text-gray-700 font-medium">
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="custom-heading text-[#11693A] text-lg block mb-1">Gender</label>
                                <select id="gender" required class="w-full border-4 border-[#11693A] rounded-xl p-2 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all bg-white text-[#11693A] font-semibold">
                                    <option value="" disabled selected hidden>Select</option>
                                    <option>Male</option>
                                    <option>Female</option>
                                </select>
                            </div>
                            <div>
                                <label class="custom-heading text-[#11693A] text-lg block mb-1">Faculty ID Upload</label>
                                <div class="relative">
                                    <input type="file" id="facultyId" accept="image/*,.pdf" class="w-full border-4 border-[#11693A] rounded-xl p-2 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all file:mr-4 file:py-1 file:px-3 file:rounded-full file:border-0 file:bg-[#11693A] file:text-white file:font-semibold hover:file:bg-[#0d522d] text-gray-600">
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="custom-heading text-[#11693A] text-lg block mb-1">Contact Number</label>
                                <input type="tel" id="contact" required placeholder="09xxxxxxxxx" class="w-full border-4 border-[#11693A] rounded-xl p-2 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all">
                            </div>
                            <div>
                                <label class="custom-heading text-[#11693A] text-lg block mb-1">Email Address</label>
                                <input type="email" id="email" required placeholder="name@gmail.com" class="w-full border-4 border-[#11693A] rounded-xl p-2 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all">
                            </div>
                        </div>

                        <div>
                            <label class="custom-heading text-[#11693A] text-lg block mb-1">Course / Program</label>
                            <div class="relative" id="courseDropdownContainer">
                                <select id="course" required style="display:none">
                                    <option value="" disabled selected>Select Course</option>
                                    <option>BS Information Technology (BSIT)</option>
                                    <option>BS Computer Science (BSCS)</option>
                                    <option>Bachelor of Entertainment and Multimedia Computing (BEMC)</option> 
                                    <option>Bachelor of Elementary Education (BEED)</option>
                                    <option>Bachelor of Secondary Education (BSED)</option>
                                    <option>Bachelor of Physical Education (BPED)</option>
                                    <option>BS Business Administration</option>
                                    <option>BS Entrepreneurship</option>
                                    <option>BS Management Accounting</option>
                                    <option>BS Accounting Information System</option>
                                    <option>BS Hospitality Management</option>
                                    <option>BS Tourism Management</option>
                                    <option>BA Political Science</option>
                                    <option>BA English Language Studies</option>
                                    <option>BS Psychology</option>
                                    <option>BS Legal Management</option>
                                    <option>BS Agriculture</option>
                                    <option>Bachelor of Agricultural Technology</option>
                                    <option>BS Food Technology</option>
                                    <option>BS Criminology</option>
                                </select>
                                <input type="text" id="courseSearch" placeholder="Search course..." autocomplete="off" readonly
                                    class="w-full border-4 border-[#11693A] rounded-xl p-2 pr-10 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all bg-white text-[#11693A] font-semibold cursor-pointer">
                                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-[#11693A]">
                                    <i data-lucide="chevron-down" class="h-6 w-6 transition-transform"></i>
                                </div>
                                <div id="courseDropdownList" class="hidden fixed z-50 bg-white border-2 border-[#11693A] rounded-xl max-h-48 overflow-y-auto shadow-lg"></div>
                            </div>
                        </div>

                        <button type="button" onclick="goToStep2()" class="w-full max-w-[250px] mx-auto block bg-[#11693A] text-white py-3 rounded-full text-2xl font-bold custom-heading hover:bg-[#0d522d] transition-all transform hover:scale-[1.02] active:scale-95 shadow-md mt-6">
                            Next
                        </button>
                    </div>

                    <div id="step2" class="space-y-4 hidden">
                        <div>
                            <label class="custom-heading text-[#11693A] text-lg block mb-1">Employee ID</label>
                            <input type="text" id="empId" placeholder="Enter ID Number" class="w-full border-4 border-[#11693A] rounded-xl p-2 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all">
                        </div>

                        <div>
                            <label class="custom-heading text-[#11693A] text-lg block mb-1">Password</label>
                            <div class="relative flex items-center">
                                <input type="password" id="password" placeholder="••••••••" class="w-full border-4 border-[#11693A] rounded-xl p-2 pr-12 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all">
                                <button type="button" onclick="togglePasswordVisibility('password', 'eyeIcon1')" class="absolute right-4 text-[#11693A] hover:text-emerald-600 transition-colors focus:outline-none">
                                    <i id="eyeIcon1" data-lucide="eye-off" class="w-6 h-6"></i>
                                </button>
                            </div>
                        </div>

                        <div>
                            <label class="custom-heading text-[#11693A] text-lg block mb-1">Confirm Password</label>
                            <div class="relative flex items-center">
                                <input type="password" id="confirmPassword" placeholder="••••••••" class="w-full border-4 border-[#11693A] rounded-xl p-2 pr-12 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all">
                                <button type="button" onclick="togglePasswordVisibility('confirmPassword', 'eyeIcon2')" class="absolute right-4 text-[#11693A] hover:text-emerald-600 transition-colors focus:outline-none">
                                    <i id="eyeIcon2" data-lucide="eye-off" class="w-6 h-6"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="w-full max-w-[250px] mx-auto block bg-[#11693A] text-white py-3 rounded-full text-2xl font-bold custom-heading hover:bg-[#0d522d] transition-all transform hover:scale-[1.02] active:scale-95 shadow-md mt-6">
                            Register
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <!-- Alert Modal -->
    <div id="alertModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
        <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl text-center">
            <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                <i data-lucide="info"></i>
            </div>
            <h3 class="custom-heading text-xl font-bold text-[#11693A] mb-2">Notice</h3>
            <p id="alertMessage" class="custom-text text-sm text-gray-500 mb-6"></p>
            <button type="button" id="alertOkBtn" class="w-full bg-[#11693A] text-white py-3 rounded-xl font-bold">OK</button>
        </div>
    </div>

    <script>
        // ===== ALERT MODAL HELPERS =====
        function showAlert(message) {
            document.getElementById('alertMessage').textContent = message;
            document.getElementById('alertModal').classList.remove('hidden');
        }

        document.getElementById('alertOkBtn').addEventListener('click', () => {
            document.getElementById('alertModal').classList.add('hidden');
        });

        document.getElementById('alertModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('alertModal')) {
                document.getElementById('alertModal').classList.add('hidden');
            }
        });

        let currentStep = 1;

        const COURSES = [
            "BS Information Technology (BSIT)",
            "BS Computer Science (BSCS)",
            "Bachelor of Entertainment and Multimedia Computing (BEMC)",
            "Bachelor of Elementary Education (BEED)",
            "Bachelor of Secondary Education (BSED)",
            "Bachelor of Physical Education (BPED)",
            "BS Business Administration",
            "BS Entrepreneurship",
            "BS Management Accounting",
            "BS Accounting Information System",
            "BS Hospitality Management",
            "BS Tourism Management",
            "BA Political Science",
            "BA English Language Studies",
            "BS Psychology",
            "BS Legal Management",
            "BS Agriculture",
            "Bachelor of Agricultural Technology",
            "BS Food Technology",
            "BS Criminology"
        ];

        let selectedCourse = '';

        function initCourseDropdown() {
            const searchInput = document.getElementById('courseSearch');
            const dropdownList = document.getElementById('courseDropdownList');
            const hiddenSelect = document.getElementById('course');

            function buildDropdown(filter) {
                dropdownList.innerHTML = '';
                const filtered = filter
                    ? COURSES.filter(c => c.toLowerCase().includes(filter.toLowerCase()))
                    : COURSES;

                if (filtered.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'p-3 text-gray-400 text-center';
                    empty.textContent = 'No courses found';
                    dropdownList.appendChild(empty);
                    return;
                }

                filtered.forEach(course => {
                    const item = document.createElement('div');
                    item.className = 'p-3 hover:bg-emerald-100 cursor-pointer text-[#11693A] font-semibold border-b border-gray-100 last:border-b-0 transition-colors';
                    item.textContent = course;
                    item.addEventListener('mousedown', function(e) {
                        e.preventDefault();
                        selectCourse(course);
                    });
                    dropdownList.appendChild(item);
                });
            }

            function selectCourse(course) {
                searchInput.value = course;
                selectedCourse = course;
                hiddenSelect.value = course;
                dropdownList.classList.add('hidden');
                searchInput.setAttribute('readonly', true);
                searchInput.classList.remove('border-red-500');
            }

            function positionDropdown() {
                const rect = searchInput.getBoundingClientRect();
                dropdownList.style.top = (rect.bottom + 4) + 'px';
                dropdownList.style.left = rect.left + 'px';
                dropdownList.style.width = rect.width + 'px';
            }

            function openDropdown() {
                positionDropdown();
                dropdownList.classList.remove('hidden');
            }

            function closeDropdown() {
                dropdownList.classList.add('hidden');
            }

            searchInput.addEventListener('focus', function() {
                searchInput.removeAttribute('readonly');
                buildDropdown(searchInput.value);
                openDropdown();
            });

            searchInput.addEventListener('input', function() {
                buildDropdown(this.value);
                openDropdown();
            });

            window.addEventListener('scroll', function() {
                if (!dropdownList.classList.contains('hidden')) {
                    positionDropdown();
                }
            }, true);

            window.addEventListener('resize', function() {
                if (!dropdownList.classList.contains('hidden')) {
                    positionDropdown();
                }
            });

            searchInput.addEventListener('blur', function() {
                setTimeout(function() {
                    closeDropdown();
                    if (!selectedCourse) {
                        searchInput.setAttribute('readonly', true);
                    }
                }, 200);
            });

            document.addEventListener('click', function(e) {
                const container = document.getElementById('courseDropdownContainer');
                if (!container.contains(e.target)) {
                    closeDropdown();
                    if (!selectedCourse) {
                        searchInput.setAttribute('readonly', true);
                    }
                }
            });

            searchInput.addEventListener('keydown', function(e) {
                const items = dropdownList.querySelectorAll('div:not(.text-gray-400)');
                if (items.length === 0) return;

                const active = dropdownList.querySelector('.bg-emerald-200');
                let idx = active ? Array.from(items).indexOf(active) : -1;

                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (active) active.classList.remove('bg-emerald-200');
                    idx = Math.min(idx + 1, items.length - 1);
                    items[idx].classList.add('bg-emerald-200');
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (active) active.classList.remove('bg-emerald-200');
                    idx = Math.max(idx - 1, 0);
                    items[idx].classList.add('bg-emerald-200');
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (active) {
                        selectCourse(active.textContent);
                    }
                } else if (e.key === 'Escape') {
                    closeDropdown();
                }
            });
        }

        document.addEventListener('DOMContentLoaded', initCourseDropdown);

        function togglePasswordVisibility(inputId, iconId) {
            const passwordInput = document.getElementById(inputId);
            const eyeIcon = document.getElementById(iconId);
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                eyeIcon.setAttribute('data-lucide', 'eye');
            } else {
                passwordInput.type = "password";
                eyeIcon.setAttribute('data-lucide', 'eye-off');
            }
            lucide.createIcons();
        }

        function goToStep2() {
            const form = document.getElementById('regForm');
            
            // Isinama ang bagong select input sa tracking validation para sa Step 1
            const step1Inputs = [
                document.getElementById('fullName'),
                document.getElementById('gender'),
                document.getElementById('contact'),
                document.getElementById('email')
            ];

            let isStep1Valid = true;
            step1Inputs.forEach(input => {
                if (!input.checkValidity()) {
                    isStep1Valid = false;
                }
            });

            const courseSearch = document.getElementById('courseSearch');
            if (!courseSearch.value) {
                isStep1Valid = false;
                courseSearch.classList.add('border-red-500');
            } else {
                courseSearch.classList.remove('border-red-500');
            }

            if (!isStep1Valid) {
                form.reportValidity();
                return; 
            }

            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
            
            document.getElementById('empId').required = true;
            document.getElementById('password').required = true;
            document.getElementById('confirmPassword').required = true;
            
            currentStep = 2;
        }

        function handleBack() {
            if (currentStep === 2) {
                document.getElementById('step2').classList.add('hidden');
                document.getElementById('step1').classList.remove('hidden');
                
                document.getElementById('empId').required = false;
                document.getElementById('password').required = false;
                document.getElementById('confirmPassword').required = false;
                
                currentStep = 1;
            } else {
                window.location.href = '/';
            }
        }

        function parseFullName(fullName) {
            const parts = fullName.split(',').map(s => s.trim());
            let lastName = '', firstName = '';
            if (parts.length >= 2) {
                lastName = parts[0];
                firstName = parts[1].split(' ')[0];
            } else {
                const sp = fullName.split(' ');
                firstName = sp[0] || '';
                lastName = sp.slice(1).join(' ') || '';
            }
            return { firstName, lastName };
        }

        async function handleFormSubmit(event) {
            event.preventDefault(); 
            
            const pass = document.getElementById('password').value;
            const confirmPass = document.getElementById('confirmPassword').value;

            if (pass !== confirmPass) {
                showAlert('Error: Passwords do not match! Please check again.');
                document.getElementById('confirmPassword').focus();
                return;
            }

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const contact = document.getElementById('contact').value.trim();
            const facultyIdFile = document.getElementById('facultyId').files[0];

            const { firstName, lastName } = parseFullName(fullName);
            const submitBtn = document.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i data-lucide="loader-circle" class="animate-spin mr-2" style="width:16px;height:16px;"></i> Registering...';
            lucide.createIcons();

            try {
                const formData = new FormData();
                formData.append('username', email);
                formData.append('email', email);
                formData.append('first_name', firstName);
                formData.append('last_name', lastName);
                formData.append('password', pass);
                formData.append('password2', confirmPass);
                formData.append('role', 'coordinator');
                formData.append('phone_number', contact);
                formData.append('course', selectedCourse);
                if (facultyIdFile) {
                    formData.append('faculty_id', facultyIdFile);
                }

                const response = await fetch('/api/auth/register/', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('auth_token', data.token);
                    localStorage.setItem('user_data', JSON.stringify(data.user));
                    showAlert('Coordinator account created successfully! Pending admin approval.');
                    window.location.href = '/auth/login/';
                } else {
                    const errMsg = typeof data === 'object' ? Object.values(data).flat().join('\n') : 'Registration failed';
                    showAlert(errMsg);
                }
            } catch (err) {
                showAlert('Connection error. Please try again.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Register';
            }
        }
    lucide.createIcons();
</script>

</body>
</html>
