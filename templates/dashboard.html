{% extends 'base.html' %}

{% block title %}Dashboard - ISU OJT Monitoring{% endblock %}

{% block content %}
<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4 mb-8">
    <div class="bg-white p-4 sm:p-6 rounded-lg shadow">
        <h3 class="custom-heading text-[#11693A] text-base sm:text-lg font-bold">Total Users</h3>
        <p class="text-2xl sm:text-3xl font-bold mt-3 sm:mt-4" id="totalUsers">-</p>
    </div>
    <div class="bg-white p-4 sm:p-6 rounded-lg shadow">
        <h3 class="custom-heading text-[#11693A] text-base sm:text-lg font-bold">Total Students</h3>
        <p class="text-2xl sm:text-3xl font-bold mt-3 sm:mt-4" id="totalStudents">-</p>
    </div>
    <div class="bg-white p-4 sm:p-6 rounded-lg shadow">
        <h3 class="custom-heading text-[#11693A] text-base sm:text-lg font-bold">Total Programs</h3>
        <p class="text-2xl sm:text-3xl font-bold mt-3 sm:mt-4" id="totalPrograms">-</p>
    </div>
    <div class="bg-white p-4 sm:p-6 rounded-lg shadow">
        <h3 class="custom-heading text-[#11693A] text-base sm:text-lg font-bold">Active Applications</h3>
        <p class="text-2xl sm:text-3xl font-bold mt-3 sm:mt-4" id="activeApps">-</p>
    </div>
</div>

<div class="bg-white p-4 sm:p-6 rounded-lg shadow">
    <h2 class="custom-heading text-[#11693A] text-xl sm:text-2xl font-bold mb-4">Recent Activities</h2>
    <div id="activitiesList" class="space-y-4">
        <p class="text-gray-500">Loading activities...</p>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/auth.js"></script>
<script nonce="{{ csp_nonce }}">
    // Load dashboard data from API
    document.addEventListener('DOMContentLoaded', async function() {
        if (!(await protectDashboard('admin'))) return;
        // This will be populated with actual API calls in Phase 4
        // Dashboard initialized
    });
</script>
{% endblock %}
