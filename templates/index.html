<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISU Login Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
    <style>
        .custom-heading { font-family: 'Fredoka', sans-serif; }
        .custom-btn { font-family: 'Inter', sans-serif; }
        body {
            background-image: url('https://i.pinimg.com/736x/a9/2c/ea/a92cea60554959a99ae4581d2485d20d.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-4xl bg-white/85 rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col md:flex-row min-h-[500px]">
        
        <div class="w-full md:w-[40%] bg-[#11693A] flex items-center justify-center p-8">
            <div class="w-48 h-48 bg-white p-2 flex items-center justify-center shadow-md rounded-2xl">
                <img src="https://tse4.mm.bing.net/th/id/OIP.9kfaz2e3juU8vO3-Y-EBMQHaHa?r=0&rs=1&pid=ImgDetMain&o=7&rm=3"
                     alt="ISU Logo" 
                     class="w-full h-full object-contain">
            </div>
        </div>

        <div class="w-full md:w-[60%] flex flex-col justify-center px-8 py-10 md:px-14">
            <div class="text-[#11693A] custom-heading text-center mb-12 tracking-wide w-full">
                <h1 class="text-3xl md:text-4xl font-bold leading-tight">Isabela State University</h1>
                <h2 class="text-xl md:text-2xl font-normal mt-1">Cauayan City, Isabela</h2>
            </div>

            <div class="space-y-6 max-w-sm mx-auto w-full">
                
                <a href="/auth/admin/login/" class="custom-btn block w-full text-center bg-[#11693A] hover:bg-[#0d522d] text-white text-lg font-semibold py-4 rounded-full transition-all duration-300 transform hover:scale-[1.02] shadow-md">
                    Admin
                </a>

                <a href="/auth/coordinator/login/" class="custom-btn block w-full text-center bg-[#11693A] hover:bg-[#0d522d] text-white text-lg font-semibold py-4 rounded-full transition-all duration-300 transform hover:scale-[1.02] shadow-md">
                    OJT Coordinator
                </a>

                <a href="/auth/student/login/" class="custom-btn block w-full text-center bg-[#11693A] hover:bg-[#0d522d] text-white text-lg font-semibold py-4 rounded-full transition-all duration-300 transform hover:scale-[1.02] shadow-md">
                    OJT Student
                </a>
            </div>
        </div>
    </div>
</body>
</html>
