<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISU Login Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
    <style>
        .custom-heading { font-family: 'Fredoka', sans-serif; }
        .custom-btn { font-family: 'Inter', sans-serif; }
        body {
            /* Heto na ang direct link ng bago mong napiling green bamboo wallpaper background */
            background-image: url('https://static.vecteezy.com/system/resources/previews/027/177/798/original/jungle-bamboo-tropical-background-vector.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 md:p-8">

    <div class="w-full max-w-4xl bg-white rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col md:flex-row min-h-[520px]">
        
        <div class="w-full md:w-[40%] bg-[#11693A] flex items-center justify-center p-8 md:p-12">
            <div class="w-60 h-60 flex items-center justify-center">
                <img src="https://www.eduopinions.com/wp-content/uploads/2023/09/ISU-SEAL-DOWNSCALE-350x345.png"
                     alt="ISU Logo" 
                     class="w-full h-full object-contain">
            </div>
        </div>

        <div class="w-full md:w-[60%] flex flex-col justify-center px-8 py-12 md:px-16 bg-white">
            
            <div class="text-[#11693A] custom-heading text-center mb-10 tracking-wide w-full">
                <h1 class="text-3xl md:text-4xl font-bold leading-tight">Isabela State University</h1>
                <h2 class="text-xl md:text-2xl font-bold mt-2 text-[#11693A]">Cauayan City, Isabela</h2>
            </div>

            <div class="space-y-5 max-w-sm mx-auto w-full">
                
                <a href="/auth/admin/login/" class="custom-btn block w-full text-center bg-[#11693A] hover:bg-[#0d522d] text-white text-lg font-semibold py-4 rounded-full transition-all duration-300 transform hover:scale-[1.01] shadow-md">
                    Admin
                </a>

                <a href="/auth/coordinator/login/" class="custom-btn block w-full text-center bg-[#11693A] hover:bg-[#0d522d] text-white text-lg font-semibold py-4 rounded-full transition-all duration-300 transform hover:scale-[1.01] shadow-md">
                    OJT Coordinator
                </a>

                <a href="/auth/student/login/" class="custom-btn block w-full text-center bg-[#11693A] hover:bg-[#0d522d] text-white text-lg font-semibold py-4 rounded-full transition-all duration-300 transform hover:scale-[1.01] shadow-md">
                    OJT Student
                </a>
            </div>
            
        </div>
    </div>

</body>
</html>
