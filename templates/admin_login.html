<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - ISU</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
       .custom-heading { font-family: 'Fredoka', sans-serif; }
        .custom-btn { font-family: 'Inter', sans-serif; }
        body {
            /* Heto na ang direct link ng bago mong napiling green bamboo wallpaper background */
            background-image: url('https://static.vecteezy.com/system/resources/previews/027/177/798/original/jungle-bamboo-tropical-background-vector.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .dot-spinner__dot {
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            height: 100%;
            width: 100%;
        }

        .dot-spinner__dot::before {
            content: '';
            height: 20%;
            width: 20%;
            border-radius: 50%;
            background-color: var(--uib-color);
            transform: scale(0);
            opacity: 0.5;
            animation: pulse0112 calc(var(--uib-speed) * 1.111) ease-in-out infinite;
            box-shadow: 0 0 20px rgba(18, 31, 53, 0.3);
        }

        .dot-spinner__dot:nth-child(2) { transform: rotate(45deg); }
        .dot-spinner__dot:nth-child(2)::before { animation-delay: calc(var(--uib-speed) * -0.875); }
        .dot-spinner__dot:nth-child(3) { transform: rotate(90deg); }
        .dot-spinner__dot:nth-child(3)::before { animation-delay: calc(var(--uib-speed) * -0.75); }
        .dot-spinner__dot:nth-child(4) { transform: rotate(135deg); }
        .dot-spinner__dot:nth-child(4)::before { animation-delay: calc(var(--uib-speed) * -0.625); }
        .dot-spinner__dot:nth-child(5) { transform: rotate(180deg); }
        .dot-spinner__dot:nth-child(5)::before { animation-delay: calc(var(--uib-speed) * -0.5); }
        .dot-spinner__dot:nth-child(6) { transform: rotate(225deg); }
        .dot-spinner__dot:nth-child(6)::before { animation-delay: calc(var(--uib-speed) * -0.375); }
        .dot-spinner__dot:nth-child(7) { transform: rotate(270deg); }
        .dot-spinner__dot:nth-child(7)::before { animation-delay: calc(var(--uib-speed) * -0.25); }
        .dot-spinner__dot:nth-child(8) { transform: rotate(315deg); }
        .dot-spinner__dot:nth-child(8)::before { animation-delay: calc(var(--uib-speed) * -0.125); }

        @keyframes pulse0112 {
            0%, 100% { transform: scale(0); opacity: 0.5; }
            50% { transform: scale(1); opacity: 1; }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body class="bg-emerald-50/50 min-h-screen flex items-center justify-center p-4 font-['Inter']">

    <div id="adminLoadingMessage" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm">
        <div class="dot-spinner">
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
        </div>
    </div>

    <div class="w-full max-w-4xl bg-white rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col md:flex-row min-h-[500px]">
        
        <div class="w-full md:w-[40%] bg-[#11693A] flex flex-col items-center justify-center p-10 text-white">
            <div class="w-44 h-44 bg-white p-2 mb-8 flex items-center justify-center rounded-xl shadow-lg">
                <img src="https://tse4.mm.bing.net/th/id/OIP.9kfaz2e3juU8vO3-Y-EBMQHaHa?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Logo" class="w-full h-full object-contain">
            </div>
            <h2 class="custom-heading text-2xl font-bold"></h2>
        </div>

        <div class="w-full md:w-[60%] p-8 md:p-12 relative flex flex-col justify-center">
            
            <a href="/" class="absolute top-8 left-8 w-10 h-10 flex items-center justify-center rounded-full border border-gray-200 hover:bg-gray-100 transition-all text-[#11693A] font-bold">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
                </svg>
            </a>

            <div class="max-w-sm mx-auto w-full">
                <h1 class="custom-heading text-[#11693A] text-4xl font-bold text-center mb-10">Admin</h1>
                
                <form id="adminLoginForm" class="space-y-6">
                    {% csrf_token %}
                    <div>
                        <label class="custom-heading text-[#11693A] text-xl block mb-2">Username</label>
                        <input type="text" id="adminUsername" required class="w-full border-4 border-[#11693A] rounded-lg p-3 outline-none focus:ring-2 focus:ring-emerald-500 transition-all">
                    </div>

                     <div>
                        <label class="custom-heading text-[#11693A] text-xl block mb-2">Password</label>
                        <div class="relative flex items-center">
                            <input type="password" id="adminPassword" required class="w-full border-4 border-[#11693A] rounded-xl p-3 pr-12 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all">
                            <button type="button" onclick="togglePasswordVisibility('adminPassword', 'adminEyeIcon')" class="absolute right-4 text-[#11693A] hover:text-emerald-600 transition-colors">
                                <svg id="adminEyeIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-6 h-6">
                                    <path id="adminIconPath" stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-[#11693A] text-white py-4 rounded-full text-2xl font-bold custom-heading hover:bg-[#0d522d] transition-all transform hover:scale-[1.02] active:scale-95 shadow-md mt-4">
                        Login
                    </button>

                </form>

                <div class="text-center mt-6">
                    <a href="{% url 'forgotpassword' %}" class="text-[#11693A] underline custom-text text-sm font-semibold hover:text-emerald-700">Forgot Password? Click here!</a>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/auth.js?v=2"></script>
    <script>
        function togglePasswordVisibility(inputId, iconId) {
            const passwordInput = document.getElementById(inputId);
            const iconPath = document.getElementById(iconId.replace('Icon', 'IconPath') || 'adminIconPath');
            
            const eyeOpen = "M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178zM15 12a3 3 0 11-6 0 3 3 0 016 0z";
            const eyeClosed = "M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88";

            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                iconPath.setAttribute("d", eyeOpen);
            } else {
                passwordInput.type = "password";
                iconPath.setAttribute("d", eyeClosed);
            }
        }

        function showToast(message) {
            try {
                const parsed = JSON.parse(message);
                if (parsed.non_field_errors) message = parsed.non_field_errors[0];
                else if (parsed.detail) message = parsed.detail;
            } catch (_) {}

            const existing = document.querySelector('.toast-error');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'toast-error fixed bottom-6 right-6 z-[100] flex items-center gap-3 bg-[#FEF2F2] border border-[#FEE2E2] text-[#1E293B] px-4 py-3 rounded-md shadow-[0_4px_12px_rgba(0,0,0,0.05)] text-sm w-[380px] animate-[slideIn_0.3s_ease-out]';
            function dismissToast(el) {
                el.style.transition = 'all 0.3s ease-out';
                el.style.opacity = '0';
                el.style.transform = 'translateX(100px)';
                setTimeout(() => el.remove(), 300);
            }

            toast.innerHTML = '<svg width="18" height="18" viewBox="0 0 18 18" fill="none" class="shrink-0"><circle cx="9" cy="9" r="9" fill="#E11D48"/><rect x="8" y="3.5" width="2" height="7.5" rx="1" fill="white"/><circle cx="9" cy="14" r="1.2" fill="white"/></svg><span class="flex-1">' + message + '</span><button onclick="dismissToast(this.parentElement)" class="text-slate-400 hover:text-slate-600 p-1 transition-colors"><i class="fa-solid fa-xmark"></i></button>';
            document.body.appendChild(toast);

            setTimeout(() => dismissToast(toast), 3000);
        }

        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('adminUsername').value;
            const password = document.getElementById('adminPassword').value;
            const loadingDiv = document.getElementById('adminLoadingMessage');

            loadingDiv.classList.remove('hidden');

            try {
                const response = await login(username, password);
                
                if (response.user.role !== 'admin') {
                    throw new Error('Access Denied: This page is for administrators only.');
                }
                
                setTimeout(() => {
                    redirectByRole(response.user.role);
                }, 1000);
            } catch (error) {
                loadingDiv.classList.add('hidden');
                showToast(error.message || 'Login failed. Please check your credentials.');
            }
        });
    </script>

</body>
</html>
