<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | OJT Monitoring System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        .custom-heading { font-family: 'Fredoka', sans-serif; }
        .custom-text { font-family: 'Inter', sans-serif; }
        
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); animation: fadeIn 0.3s ease; }
        .modal.active { display: flex; justify-content: center; align-items: center; }
        .modal-content { background-color: #fefefe; padding: 30px; border-radius: 15px; width: 90%; max-width: 500px; box-shadow: 0 5px 25px rgba(0, 0, 0, 0.3); animation: slideUp 0.3s ease; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #e5e7eb; padding-bottom: 15px; }
        .modal-header h2 { font-family: 'Fredoka', sans-serif; color: #11693A; font-size: 24px; font-weight: bold; }
        .close-btn { background: none; border: none; font-size: 28px; cursor: pointer; color: #999; transition: color 0.2s; }
        .close-btn:hover { color: #333; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #333; font-weight: 600; font-size: 14px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; font-family: 'Inter', sans-serif; transition: border-color 0.2s; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #11693A; }
        
        .modal-buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 25px; }
        .btn-cancel, .btn-save { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.3s; }
        .btn-cancel { background: #e5e7eb; color: #333; }
        .btn-save { background: #11693A; color: white; }
        
        .detail-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
        .detail-label { font-weight: 600; color: #11693A; }
        .detail-value { color: #666; }
        
        .tab-buttons { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #e5e7eb; }
        .tab-btn { padding: 12px 20px; background: none; border: none; cursor: pointer; font-size: 16px; font-weight: 600; color: #999; border-bottom: 3px solid transparent; transition: all 0.3s; }
        .tab-btn.active { color: #11693A; border-bottom-color: #11693A; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-gray-50 flex h-screen custom-text">

    <div class="w-64 bg-[#11693A] flex flex-col items-center py-8 px-4 shadow-xl">
        <div class="w-32 h-32 bg-white p-2 mb-8 rounded-2xl shadow-lg flex items-center justify-center">
            <img src="https://tse4.mm.bing.net/th/id/OIP.9kfaz2e3juU8vO3-Y-EBMQHaHa?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="ISU Logo" class="w-full h-full object-contain">
        </div>
        <div class="w-full space-y-3">
            <button id="btn-student" class="w-full bg-white text-[#11693A] py-3 rounded-full text-sm font-bold shadow-md hover:shadow-lg transition-all" onclick="window.location.href='/dashboard/admin/'">OJT Student Accounts</button>
            <button id="btn-coordinator" class="w-full bg-white text-[#11693A] py-3 rounded-full text-sm font-bold shadow-md hover:shadow-lg transition-all" onclick="window.location.href='/dashboard/admin/'">OJT Coordinator Accounts</button>
            <button id="btn-approval" class="w-full bg-white text-[#11693A] py-3 rounded-full text-sm font-bold shadow-md hover:shadow-lg transition-all" onclick="window.location.href='/dashboard/approval/'">OJT Coordinator Approval</button>
        </div>
    </div>

    <div class="flex-1 flex flex-col overflow-hidden">
        <header class="bg-white p-6 shadow-sm flex justify-between items-center">
            <h1 class="custom-heading text-3xl font-bold text-[#11693A]">OJT Student Accounts</h1>
            <a href="/" class="flex items-center gap-1.5 bg-[#11693A] text-white px-4 py-1.5 rounded-lg text-sm font-bold hover:bg-[#0d522d] transition-all shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
                Logout
            </a>
        </header>

        <main class="p-8 flex-1 overflow-y-auto">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <div id="student" class="tab-content active">
                    <div class="flex justify-between items-center mb-6">
                        <input type="text" placeholder="Search student..." id="searchInput" class="border-2 border-gray-200 rounded-lg px-4 py-1.5 w-64 text-sm focus:outline-none focus:border-[#11693A]">
                        <button class="bg-violet-600 text-white px-4 py-1.5 rounded-lg text-sm font-bold hover:bg-violet-700 transition-all shadow-sm" onclick="openAddStudentModal()">
                            + Add Student
                        </button>
                    </div>

                    <table class="w-full text-left border-collapse">
                        <thead class="text-gray-500 font-bold border-b border-gray-100">
                            <tr>
                                <th class="pb-4 px-2">Name</th>
                                <th class="pb-4 px-2">Email</th>
                                <th class="pb-4 px-2">Role</th>
                                <th class="pb-4 px-2">Status</th>
                                <th class="pb-4 px-2">Action</th>
                            </tr>
                        </thead>
                        <tbody class="text-gray-700" id="studentTableBody">
                            <!-- Students will be loaded dynamically from the database -->
                        </tbody>
                    </table>
                </div>


            </div>
        </main>
    </div>

    <!-- View Modal -->
    <div id="viewModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Student Details</h2>
                <button class="close-btn" onclick="closeModal('viewModal')">&times;</button>
            </div>
            <div id="viewDetails">
                <!-- Details will be populated here -->
            </div>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal('viewModal')">Close</button>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Student</h2>
                <button class="close-btn" onclick="closeModal('editModal')">&times;</button>
            </div>
            <form id="editForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="editName" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="editEmail" required>
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select id="editRole">
                        <option>OJT Student</option>
                        <option>OJT Coordinator</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="editStatus">
                        <option>Active</option>
                        <option>Inactive</option>
                    </select>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn-cancel" onclick="closeModal('editModal')">Cancel</button>
                    <button type="button" class="btn-save" onclick="saveChanges()">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Add Student Modal -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add New Student</h2>
                <button class="close-btn" onclick="closeModal('addModal')">&times;</button>
            </div>
            <form id="addForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="addName" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="addEmail" required>
                </div>
                <div class="form-group">
                    <label>ID Number</label>
                    <input type="text" id="addIdNumber" required>
                </div>
                <div class="form-group">
                    <label>Course / Program</label>
                    <select id="addCourse" required>
                        <option value="">Select Course</option>
                        <option>BS Information Technology (BSIT)</option>
                        <option>BS Computer Science (BSCS)</option>
                        <option>Bachelor of Entertainment and Multimedia Computing (BEMC)</option>
                        <option>Bachelor of Elementary Education (BEED)</option>
                        <option>Bachelor of Secondary Education (BSED)</option>
                        <option>Bachelor of Physical Education (BPED)</option>
                        <option>BS Business Administration</option>
                        <option>BS Entrepreneurship</option>
                        <option>BS Management Accounting</option>
                        <option>BS Accounting Information System</option>
                        <option>BS Hospitality Management</option>
                        <option>BS Tourism Management</option>
                        <option>BA Political Science</option>
                        <option>BA English Language Studies</option>
                        <option>BS Psychology</option>
                        <option>BS Legal Management</option>
                        <option>BS Agriculture</option>
                        <option>Bachelor of Agricultural Technology</option>
                        <option>BS Food Technology</option>
                        <option>BS Criminology</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select id="addRole">
                        <option>OJT Student</option>
                        <option>OJT Coordinator</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="addStatus">
                        <option>Active</option>
                        <option>Inactive</option>
                    </select>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn-cancel" onclick="closeModal('addModal')">Cancel</button>
                    <button type="button" class="btn-save" onclick="addNewStudent()">Add Student</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Delete Student</h2>
                <button class="close-btn" onclick="closeModal('deleteModal')">&times;</button>
            </div>
            <p style="color: #666; margin-bottom: 20px; font-size: 16px;">
                Are you sure you want to delete <strong id="deleteStudentName"></strong>? This action cannot be undone.
            </p>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal('deleteModal')">Cancel</button>
                <button class="btn-save" style="background: #dc2626;" onclick="confirmDelete()" onmouseover="this.style.background='#b91c1c'" onmouseout="this.style.background='#dc2626'">Delete Permanently</button>
            </div>
        </div>
    </div>


    <script>
        let students = {};
        let currentEditId = null;
        let currentDeleteId = null;
        let nextStudentId = 0;

        // Load students from database on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadStudents();
            initializeActiveButton();
        });

        // Fetch students from API
        async function loadStudents() {
            try {
                const response = await fetch('/api/admin/admin-dashboard/students/', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken'),
                        'Authorization': `Token ${localStorage.getItem('auth_token')}`
                    }
                });

                if (!response.ok) {
                    console.error('Failed to load students:', response.status);
                    return;
                }

                const studentsList = await response.json();
                
                // Clear the table
                const tbody = document.getElementById('studentTableBody');
                tbody.innerHTML = '';

                // If no students, display nothing
                if (!studentsList || studentsList.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="py-8 px-4 text-center text-gray-400">No OJT students registered in the database</td></tr>';
                    return;
                }

                // Add each student to the table
                studentsList.forEach((student, index) => {
                    students[index] = {
                        id: student.id,
                        name: student.first_name + ' ' + student.last_name,
                        email: student.email,
                        username: student.username,
                        role: student.role || 'OJT Student',
                        status: student.is_active ? 'Active' : 'Inactive'
                    };

                    const row = document.createElement('tr');
                    row.id = `row-${index}`;
                    row.className = 'border-b border-gray-50 hover:bg-gray-50 transition-colors';
                    
                    const statusClass = student.is_active ? 'emerald' : 'yellow';
                    const statusText = student.is_active ? 'Active' : 'Inactive';

                    row.innerHTML = `
                        <td class="py-4 px-2 font-bold">${students[index].name}</td>
                        <td class="py-4 px-2">${student.email}</td>
                        <td class="py-4 px-2">OJT Student</td>
                        <td class="py-4 px-2">
                            <span class="bg-${statusClass}-100 text-${statusClass}-700 px-3 py-1 rounded-full text-xs font-bold">${statusText}</span>
                        </td>
                        <td class="py-4 px-2">
                            <button class="text-blue-500 hover:text-blue-700" title="View" onclick="viewStudent(${index})">👁️</button>
                            <button class="text-amber-500 hover:text-amber-700" title="Edit" onclick="editStudent(${index})">✎</button>
                            <button class="text-red-500 hover:text-red-700" title="Delete" onclick="deleteStudent(${index})">🗑️</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });

                nextStudentId = studentsList.length;
            } catch (error) {
                console.error('Error loading students:', error);
            }
        }

        // Get CSRF token from cookies
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        // Initialize sidebar button active state
        function initializeActiveButton() {
            const currentPage = window.location.pathname.split('/').pop() || 'admin_dashboard.html';
            
            const btnStudent = document.getElementById('btn-student');
            const btnCoordinator = document.getElementById('btn-coordinator');
            const btnApproval = document.getElementById('btn-approval');
            
            // Default inactive button style
            const inactiveStyle = 'w-full bg-white text-[#11693A] py-3 rounded-full text-sm font-bold shadow-md hover:shadow-lg transition-all';
            // Active button style (green background)
            const activeStyle = 'w-full bg-[#11693A] text-white py-3 rounded-full text-sm font-bold shadow-md hover:shadow-lg transition-all';
            
            // Reset all buttons to inactive state
            if (btnStudent) btnStudent.className = inactiveStyle;
            if (btnCoordinator) btnCoordinator.className = inactiveStyle;
            if (btnApproval) btnApproval.className = inactiveStyle;
            
            // Apply active state to current page button
            if (currentPage.includes('admin_dashboard') || currentPage === '') {
                if (btnStudent) btnStudent.className = activeStyle;
            }
        }

        // Open modal
        function openModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // Close modal
        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // Close modal when clicking outside
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    closeModal(modal.id);
                }
            });
        });

        // ===== STUDENT FUNCTIONS =====
        
        // Filter student table
        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.addEventListener('keyup', function() {
                const filter = this.value.toUpperCase();
                const tbody = document.getElementById('studentTableBody');
                const rows = tbody.getElementsByTagName('tr');

                Array.from(rows).forEach(row => {
                    const text = row.textContent.toUpperCase();
                    row.style.display = text.includes(filter) ? '' : 'none';
                });
            });
        }

        // View student details
        function viewStudent(id) {
            const student = students[id];
            if (!student) return;

            const detailsHtml = `
                <div class="detail-row">
                    <span class="detail-label">Name:</span>
                    <span class="detail-value">${student.name}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Username:</span>
                    <span class="detail-value">${student.username}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Email:</span>
                    <span class="detail-value">${student.email}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Role:</span>
                    <span class="detail-value">${student.role}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Status:</span>
                    <span class="detail-value">${student.status}</span>
                </div>
            `;

            document.getElementById('viewDetails').innerHTML = detailsHtml;
            openModal('viewModal');
        }

        // Edit student
        function editStudent(id) {
            currentEditId = id;
            const student = students[id];
            if (!student) return;

            document.getElementById('editName').value = student.name;
            document.getElementById('editEmail').value = student.email;
            document.getElementById('editRole').value = student.role;
            document.getElementById('editStatus').value = student.status;

            openModal('editModal');
        }

        // Save student changes
        function saveChanges() {
            if (currentEditId === null) return;

            const student = students[currentEditId];
            student.name = document.getElementById('editName').value;
            student.email = document.getElementById('editEmail').value;
            student.role = document.getElementById('editRole').value;
            student.status = document.getElementById('editStatus').value;

            const row = document.querySelector(`#row-${currentEditId}`);
            if (row) {
                const cells = row.querySelectorAll('td');
                cells[0].textContent = student.name;
                cells[1].textContent = student.email;
                cells[2].textContent = student.role;
                cells[3].innerHTML = `<span class="bg-${student.status === 'Active' ? 'emerald' : 'yellow'}-100 text-${student.status === 'Active' ? 'emerald' : 'yellow'}-700 px-3 py-1 rounded-full text-xs font-bold">${student.status}</span>`;
            }

            alert('✓ Student information updated successfully!');
            closeModal('editModal');
        }

        // Delete student
        function deleteStudent(id) {
            currentDeleteId = id;
            const student = students[id];
            if (!student) return;

            document.getElementById('deleteStudentName').textContent = student.name;
            openModal('deleteModal');
        }

        // Confirm delete student
        function confirmDelete() {
            if (currentDeleteId === null) return;

            const row = document.querySelector(`#row-${currentDeleteId}`);
            if (row) {
                row.style.opacity = '0';
                row.style.transition = 'opacity 0.3s ease';
                setTimeout(() => {
                    row.remove();
                    delete students[currentDeleteId];
                    alert('✓ Student deleted successfully!');
                    closeModal('deleteModal');
                }, 300);
            }
        }

        // Open Add Student Modal
        function openAddStudentModal() {
            document.getElementById('addForm').reset();
            openModal('addModal');
        }

        // Add new student
        function addNewStudent() {
            const name = document.getElementById('addName').value.trim();
            const email = document.getElementById('addEmail').value.trim();
            const idNumber = document.getElementById('addIdNumber').value.trim();
            const course = document.getElementById('addCourse').value.trim();
            const role = document.getElementById('addRole').value;
            const status = document.getElementById('addStatus').value;

            if (!name || !email || !idNumber || !course) {
                alert('⚠️ Please fill in all required fields');
                return;
            }

            for (let id in students) {
                if (students[id].email === email) {
                    alert('⚠️ This email is already registered');
                    return;
                }
            }

            const newId = nextStudentId++;
            students[newId] = {
                name: name,
                email: email,
                role: role,
                status: status
            };

            const tbody = document.getElementById('studentTableBody');
            const newRow = document.createElement('tr');
            newRow.id = `row-${newId}`;
            newRow.className = 'border-b border-gray-50 hover:bg-gray-50 transition-colors';
            newRow.innerHTML = `
                <td class="py-4 px-2 font-bold">${name}</td>
                <td class="py-4 px-2">${email}</td>
                <td class="py-4 px-2">${role}</td>
                <td class="py-4 px-2">
                    <span class="bg-${status === 'Active' ? 'emerald' : 'yellow'}-100 text-${status === 'Active' ? 'emerald' : 'yellow'}-700 px-3 py-1 rounded-full text-xs font-bold">${status}</span>
                </td>
                <td class="py-4 px-2">
                    <button class="text-blue-500 hover:text-blue-700" title="View" onclick="viewStudent(${newId})">👁️</button>
                    <button class="text-amber-500 hover:text-amber-700" title="Edit" onclick="editStudent(${newId})">✎</button>
                    <button class="text-red-500 hover:text-red-700" title="Delete" onclick="deleteStudent(${newId})">🗑️</button>
                </td>
            `;
            tbody.appendChild(newRow);

            alert('✓ Student added successfully!');
            closeModal('addModal');
        }
    </script>
</body>
</html>
