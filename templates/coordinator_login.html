<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OJT Coordinator Login - ISU</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@0.344.0"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        .custom-heading { font-family: 'Fredoka', sans-serif; }
        .custom-btn { font-family: 'Inter', sans-serif; }
        body {
            /* Heto na ang direct link ng bago mong napiling green bamboo wallpaper background */
            background-image: url('https://static.vecteezy.com/system/resources/previews/027/177/798/original/jungle-bamboo-tropical-background-vector.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .dot-spinner {
            --uib-size: 2.8rem;
            --uib-speed: .9s;
            --uib-color: white;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            height: var(--uib-size);
            width: var(--uib-size);
        }

        .dot-spinner__dot {
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            height: 100%;
            width: 100%;
        }

        .dot-spinner__dot::before {
            content: '';
            height: 20%;
            width: 20%;
            border-radius: 50%;
            background-color: var(--uib-color);
            transform: scale(0);
            opacity: 0.5;
            animation: pulse0112 calc(var(--uib-speed) * 1.111) ease-in-out infinite;
            box-shadow: 0 0 20px rgba(18, 31, 53, 0.3);
        }

        .dot-spinner__dot:nth-child(2) { transform: rotate(45deg); }
        .dot-spinner__dot:nth-child(2)::before { animation-delay: calc(var(--uib-speed) * -0.875); }
        .dot-spinner__dot:nth-child(3) { transform: rotate(90deg); }
        .dot-spinner__dot:nth-child(3)::before { animation-delay: calc(var(--uib-speed) * -0.75); }
        .dot-spinner__dot:nth-child(4) { transform: rotate(135deg); }
        .dot-spinner__dot:nth-child(4)::before { animation-delay: calc(var(--uib-speed) * -0.625); }
        .dot-spinner__dot:nth-child(5) { transform: rotate(180deg); }
        .dot-spinner__dot:nth-child(5)::before { animation-delay: calc(var(--uib-speed) * -0.5); }
        .dot-spinner__dot:nth-child(6) { transform: rotate(225deg); }
        .dot-spinner__dot:nth-child(6)::before { animation-delay: calc(var(--uib-speed) * -0.375); }
        .dot-spinner__dot:nth-child(7) { transform: rotate(270deg); }
        .dot-spinner__dot:nth-child(7)::before { animation-delay: calc(var(--uib-speed) * -0.25); }
        .dot-spinner__dot:nth-child(8) { transform: rotate(315deg); }
        .dot-spinner__dot:nth-child(8)::before { animation-delay: calc(var(--uib-speed) * -0.125); }

        @keyframes pulse0112 {
            0%, 100% { transform: scale(0); opacity: 0.5; }
            50% { transform: scale(1); opacity: 1; }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body class="bg-emerald-50/50 min-h-screen flex items-center justify-center p-4">

    <div id="loadingMessage" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm">
        <div class="dot-spinner">
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
        </div>
    </div>

    <div class="w-full max-w-4xl bg-white rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col md:flex-row min-h-[500px]">
        
        <div class="w-full md:w-[40%] bg-[#11693A] flex flex-col items-center justify-center p-10 text-white">
            <div class="w-60 h-60 flex items-center justify-center">
                <img src="https://www.eduopinions.com/wp-content/uploads/2023/09/ISU-SEAL-DOWNSCALE-350x345.png"
                     alt="ISU Logo" 
                     class="w-full h-full object-contain">
            </div>
            <p class="custom-text mb-4 font-medium italic opacity-90 text-sm">Don't have an account?</p>
            <a href="{% url 'coordinator-register' %}" class="w-full max-w-[200px] border-2 border-white rounded-full py-2 px-6 font-bold hover:bg-white hover:text-[#11693A] transition-all duration-300 text-center block">
                Register
            </a>
        </div>

        <div class="w-full md:w-[60%] p-8 md:p-12 relative flex flex-col justify-center">
            
            <a href="{% url 'home' %}" class="absolute top-8 left-8 w-10 h-10 flex items-center justify-center rounded-full border border-gray-200 hover:bg-gray-100 transition-all shadow-sm text-[#11693A]">
                <i data-lucide="chevron-left" class="w-5 h-5"></i>
            </a>

            <div class="max-w-sm mx-auto w-full">
                <h1 class="custom-heading text-[#11693A] text-3xl md:text-4xl font-bold text-center mb-10 leading-tight">OJT Coordinator</h1>
                
                <form id="coordinatorLoginForm" class="space-y-6">
                    <div>
                        <label class="custom-heading text-[#11693A] text-xl block mb-2">Email / Employee ID</label>
                        <input type="text" id="coordinatorIdentifier" required class="w-full border-4 border-[#11693A] rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all">
                    </div>

                    <div>
                        <label class="custom-heading text-[#11693A] text-xl block mb-2">Password</label>
                        <div class="relative flex items-center">
                            <input type="password" id="coordinatorPassword" required class="w-full border-4 border-[#11693A] rounded-xl p-3 pr-12 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all">
                            <button type="button" onclick="togglePasswordVisibility('coordinatorPassword', 'coordinatorEyeIcon')" class="absolute right-4 text-[#11693A] hover:text-emerald-600 transition-colors">
                                <i id="coordinatorEyeIcon" data-lucide="eye-off" class="w-6 h-6"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-[#11693A] text-white py-4 rounded-full text-2xl font-bold custom-heading hover:bg-[#0d522d] transition-all transform hover:scale-[1.02] active:scale-95 shadow-md mt-4">
                        Login
                    </button>
                    
                </form>

                <div class="text-center mt-4">
                    <a href="{% url 'forgotpassword' %}" class="text-[#11693A] font-semibold hover:underline custom-text text-sm">
                        Forgot Password? Click here!
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/auth.js?v=3"></script>
    <script>
        function togglePasswordVisibility(inputId, iconId) {
            const passwordInput = document.getElementById(inputId);
            const eyeIcon = document.getElementById(iconId);
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                eyeIcon.setAttribute('data-lucide', 'eye');
            } else {
                passwordInput.type = "password";
                eyeIcon.setAttribute('data-lucide', 'eye-off');
            }
            lucide.createIcons();
        }

        function showToast(message) {
            try {
                const parsed = JSON.parse(message);
                if (parsed.non_field_errors) message = parsed.non_field_errors[0];
                else if (parsed.detail) message = parsed.detail;
            } catch (_) {}

            const existing = document.querySelector('.toast-error');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'toast-error fixed bottom-6 right-6 z-[100] flex items-center gap-3 bg-[#FEF2F2] border border-[#FEE2E2] text-[#1E293B] px-4 py-3 rounded-md shadow-[0_4px_12px_rgba(0,0,0,0.05)] text-sm w-[380px] animate-[slideIn_0.3s_ease-out]';
            function dismissToast(el) {
                el.style.transition = 'all 0.3s ease-out';
                el.style.opacity = '0';
                el.style.transform = 'translateX(100px)';
                setTimeout(() => el.remove(), 300);
            }

            toast.innerHTML = '<i data-lucide="alert-circle" class="shrink-0" style="width:18px;height:18px;color:#E11D48;"></i><span class="flex-1">' + message + '</span><button onclick="dismissToast(this.parentElement)" class="text-slate-400 hover:text-slate-600 p-1 transition-colors"><i data-lucide="x" style="width:14px;height:14px;"></i></button>';
            document.body.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => dismissToast(toast), 3000);
        }

        document.getElementById('coordinatorLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const identifier = document.getElementById('coordinatorIdentifier').value;
            const password = document.getElementById('coordinatorPassword').value;
            const loadingDiv = document.getElementById('loadingMessage');

            loadingDiv.classList.remove('hidden');

            try {
                const response = await login(identifier, password);
                
                if (response.user.role !== 'coordinator') {
                    throw new Error('Access Denied: This page is for coordinators only.');
                }
                
                setTimeout(() => {
                    redirectByRole(response.user.role);
                }, 1000);
            } catch (error) {
                loadingDiv.classList.add('hidden');
                showToast(error.message || 'Login failed. Please check your credentials.');
            }
        });
    lucide.createIcons();
    </script>

</body>
</html>
