<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - ISU OJT Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@0.344.0"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght=600;700&family=Inter:wght=400;500;600;700&display=swap" rel="stylesheet">
    <style>
       .custom-heading { font-family: 'Fredoka', sans-serif; }
        .custom-btn { font-family: 'Inter', sans-serif; }
        body {
            /* Heto na ang direct link ng bago mong napiling green bamboo wallpaper background */
            background-image: url('https://static.vecteezy.com/system/resources/previews/027/177/798/original/jungle-bamboo-tropical-background-vector.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        /* Toast notification styles */
        .toast {
            font-family: 'Inter', sans-serif;
            transform: translateX(0);
            transition: all 0.3s ease-out;
        }
        .toast-title {
            font-family: 'Fredoka', sans-serif;
        }
        @keyframes slideIn {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(120%); opacity: 0; }
        }
    </style>
</head>
<body class="bg-gray-400/50 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <div class="absolute inset-0 bg-black/20 backdrop-blur-sm z-0"></div>

    <div class="w-full max-w-lg bg-[#F9F9F6] rounded-[2.5rem] shadow-2xl overflow-hidden z-10 border border-gray-100 flex flex-col">
        
        <div class="bg-[#11693A] text-white py-5 px-6 text-center relative">
            <h1 class="custom-heading text-3xl font-bold tracking-wide">Forgot Password?</h1>
        </div>

        <div class="p-8 md:p-10 flex flex-col justify-center">
            
            <div id="step1" class="space-y-6">
                <p class="custom-text text-[#11693A] font-semibold text-center text-base md:text-lg leading-relaxed max-w-sm mx-auto">
                    Enter your email address and we'll send you a one-time code to reset your password.
                </p>
                
                <form id="formStep1" class="space-y-5">
                    <div>
                        <label class="custom-heading text-[#11693A] text-2xl block mb-2">Email Address</label>
                        <input type="email" required placeholder="name@isu.edu.ph" 
                            class="w-full border-4 border-[#11693A] rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all text-gray-700 font-semibold text-lg bg-white">
                    </div>

                    <button type="submit" class="w-full max-w-[220px] mx-auto block bg-[#11693A] text-white py-3 rounded-full text-2xl font-bold custom-heading hover:bg-[#0d522d] transition-all transform hover:scale-[1.02] active:scale-95 shadow-md">
                        Send OTP
                    </button>
                </form>
            </div>


            <div id="step2" class="space-y-6 hidden">
                <p class="custom-text text-[#11693A] font-semibold text-center text-base md:text-lg leading-relaxed max-w-sm mx-auto">
                    An OTP code has been sent to your email. Please enter the 6-digit code below.
                </p>
                
                <form id="formStep2" class="space-y-5">
                    <div>
                        <label class="custom-heading text-[#11693A] text-2xl block mb-2 text-center">Enter OTP Code</label>
                        <div class="flex justify-between gap-2 max-w-xs mx-auto" id="otpContainer">
                            <input type="text" maxlength="1" required class="w-12 h-12 border-4 border-[#11693A] rounded-xl text-center text-xl font-bold focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white text-gray-800" oninput="moveNext(this, 0)">
                            <input type="text" maxlength="1" required class="w-12 h-12 border-4 border-[#11693A] rounded-xl text-center text-xl font-bold focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white text-gray-800" oninput="moveNext(this, 1)">
                            <input type="text" maxlength="1" required class="w-12 h-12 border-4 border-[#11693A] rounded-xl text-center text-xl font-bold focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white text-gray-800" oninput="moveNext(this, 2)">
                            <input type="text" maxlength="1" required class="w-12 h-12 border-4 border-[#11693A] rounded-xl text-center text-xl font-bold focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white text-gray-800" oninput="moveNext(this, 3)">
                            <input type="text" maxlength="1" required class="w-12 h-12 border-4 border-[#11693A] rounded-xl text-center text-xl font-bold focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white text-gray-800" oninput="moveNext(this, 4)">
                            <input type="text" maxlength="1" required class="w-12 h-12 border-4 border-[#11693A] rounded-xl text-center text-xl font-bold focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white text-gray-800" oninput="moveNext(this, 5)">
                        </div>
                    </div>

                    <button type="submit" class="w-full max-w-[220px] mx-auto block bg-[#11693A] text-white py-3 rounded-full text-2xl font-bold custom-heading hover:bg-[#0d522d] transition-all transform hover:scale-[1.02] active:scale-95 shadow-md">
                        Verify OTP
                    </button>
                </form>
            </div>


            <div id="step3" class="space-y-6 hidden">
                <p class="custom-text text-[#11693A] font-semibold text-center text-base md:text-lg leading-relaxed max-w-sm mx-auto">
                    Create a strong new password to protect and secure your account access.
                </p>
                
                <form id="formStep3" class="space-y-4">
                    <div>
                        <label class="custom-heading text-[#11693A] text-xl block mb-1">New Password</label>
                        <div class="relative flex items-center">
                            <input type="password" id="newPassword" required placeholder="••••••••" 
                                class="w-full border-4 border-[#11693A] rounded-xl p-2.5 pr-12 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all text-gray-700 font-medium bg-white">
                            <button type="button" onclick="togglePassword('newPassword', 'eyeIcon1')" class="absolute right-4 text-[#11693A] focus:outline-none">
                                <i id="eyeIcon1" data-lucide="eye-off" class="w-6 h-6"></i>
                            </button>
                        </div>
                    </div>

                    <div>
                        <label class="custom-heading text-[#11693A] text-xl block mb-1">Confirm New Password</label>
                        <div class="relative flex items-center">
                            <input type="password" id="confirmNewPassword" required placeholder="••••••••" 
                                class="w-full border-4 border-[#11693A] rounded-xl p-2.5 pr-12 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all text-gray-700 font-medium bg-white">
                            <button type="button" onclick="togglePassword('confirmNewPassword', 'eyeIcon2')" class="absolute right-4 text-[#11693A] focus:outline-none">
                                <i id="eyeIcon2" data-lucide="eye-off" class="w-6 h-6"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="w-full max-w-[220px] mx-auto block bg-[#11693A] text-white py-3 rounded-full text-2xl font-bold custom-heading hover:bg-[#0d522d] transition-all transform hover:scale-[1.02] active:scale-95 shadow-md mt-6">
                        Save & Reset
                    </button>
                </form>
            </div>

            <div id="backToLoginContainer" class="mt-6 flex justify-center items-center">
                <a href="javascript:history.back()" class="flex items-center gap-2 text-gray-600 font-bold hover:text-[#11693A] transition-colors text-base md:text-lg custom-text">
                    <i data-lucide="arrow-left" class="w-5 h-5" style="stroke-width:3;"></i>
                    Back to Login
                </a>
            </div>

        </div>
    </div>

    <script>
        let verifiedOtpEmail = '';
        let verifiedOtpCode = '';

        function showToast(message, type = 'error') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const isSuccess = type === 'success';
            const bgColor = isSuccess ? 'bg-white' : 'bg-[#FEF2F2]';
            const borderColor = isSuccess ? 'border-[#11693A]/30' : 'border-[#FEE2E2]';
            const iconBg = isSuccess ? 'bg-[#11693A]' : 'bg-[#E11D48]';
            const iconSvg = isSuccess
                ? '<i data-lucide="check" class="w-5 h-5 text-white" style="stroke-width:3;"></i>'
                : '<i data-lucide="x" class="w-5 h-5 text-white" style="stroke-width:3;"></i>';

            const toast = document.createElement('div');
            toast.className = `toast fixed bottom-6 right-6 z-[100] flex items-start gap-3 ${bgColor} border ${borderColor} px-4 py-3.5 rounded-xl shadow-lg w-[400px] max-w-[90vw] animate-[slideIn_0.3s_ease-out]`;
            toast.innerHTML = `
                <div class="flex-shrink-0 w-8 h-8 ${iconBg} rounded-full flex items-center justify-center">${iconSvg}</div>
                <div class="flex-1 min-w-0">
                    <p class="toast-title text-sm font-bold text-[#1E293B]">${isSuccess ? 'Success' : 'Error'}</p>
                    <p class="text-sm text-slate-600 mt-0.5">${message}</p>
                </div>
                <button onclick="this.parentElement.remove()" class="flex-shrink-0 text-slate-400 hover:text-slate-600 transition-colors">
                    <i data-lucide="x" class="w-4 h-4" style="stroke-width:2.5;"></i>
                </button>
            `;
            lucide.createIcons();
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'slideOut 0.3s ease-in forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // Step 1: Send OTP
        document.getElementById('formStep1').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = e.target.querySelector('input[type="email"]').value;
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader-circle" class="animate-spin" style="width:16px;height:16px;"></i> Sending...';
            lucide.createIcons();
            try {
                const res = await fetch('/api/auth/send_otp/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                if (!res.ok) { const err = await res.json(); throw new Error(err.email ? err.email[0] : 'Failed to send OTP'); }
                verifiedOtpEmail = email;
                document.getElementById('step1').classList.add('hidden');
                document.getElementById('step2').classList.remove('hidden');
            } catch (err) {
                showToast(err.message, 'error');
            }
            btn.disabled = false;
            btn.textContent = 'Send OTP';
        });

        // Step 2: Verify OTP
        document.getElementById('formStep2').addEventListener('submit', async (e) => {
            e.preventDefault();
            const otpInputs = document.querySelectorAll('#otpContainer input');
            const otp = Array.from(otpInputs).map(i => i.value).join('');
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader-circle" class="animate-spin" style="width:16px;height:16px;"></i> Verifying...';
            lucide.createIcons();
            try {
                const res = await fetch('/api/auth/verify_otp/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: verifiedOtpEmail, otp })
                });
                if (!res.ok) { const err = await res.json(); throw new Error(err.otp ? err.otp[0] : 'Invalid OTP'); }
                verifiedOtpCode = otp;
                document.getElementById('step2').classList.add('hidden');
                document.getElementById('step3').classList.remove('hidden');
                document.getElementById('backToLoginContainer').classList.add('hidden');
            } catch (err) {
                showToast(err.message, 'error');
            }
            btn.disabled = false;
            btn.textContent = 'Verify OTP';
        });

        // Step 3: Reset Password
        document.getElementById('formStep3').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPass = document.getElementById('newPassword').value;
            const confirmNewPass = document.getElementById('confirmNewPassword').value;
            if (newPass !== confirmNewPass) {
                showToast('Passwords do not match.', 'error');
                document.getElementById('confirmNewPassword').focus();
                return;
            }
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader-circle" class="animate-spin" style="width:16px;height:16px;"></i> Resetting...';
            lucide.createIcons();
            try {
                const res = await fetch('/api/auth/reset_password/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: verifiedOtpEmail,
                        otp: verifiedOtpCode,
                        new_password: newPass,
                        confirm_password: confirmNewPass
                    })
                });
                if (!res.ok) { const err = await res.json(); throw new Error(Object.values(err).flat().join(', ')); }
                showToast('Password reset successful!', 'success');
                window.location.href = document.referrer || '/';
            } catch (err) {
                showToast(err.message, 'error');
            }
            btn.disabled = false;
            btn.textContent = 'Save & Reset';
        });

        // Auto-focus functionality sa OTP 6-Digit input boxes
        function moveNext(currentInput, index) {
            const inputs = document.querySelectorAll('#otpContainer input');
            if (currentInput.value.length === 1 && index < inputs.length - 1) {
                inputs[index + 1].focus();
            }
        }

        // Copy-pasted Coordinator pattern password eye toggler
        function togglePassword(inputId, iconId) {
            const passwordInput = document.getElementById(inputId);
            const eyeIcon = document.getElementById(iconId);
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                eyeIcon.setAttribute('data-lucide', 'eye');
            } else {
                passwordInput.type = "password";
                eyeIcon.setAttribute('data-lucide', 'eye-off');
            }
            lucide.createIcons();
        }
    lucide.createIcons();
    </script>
</body>
</html>
