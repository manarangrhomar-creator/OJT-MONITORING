{% extends "emails/base_email.html" %}

{% block content %}
    <p style="margin:0 0 6px; font-size:15px; color:#1f2e24;">
        Dear <strong style="color:#7B1818;">{{ recipient_name }}</strong>,
    </p>

    <div style="background-color:#F7F5F0; border-left:4px solid #C8A44A; padding:16px 18px; margin:18px 0;">
        <h2 style="margin:0 0 8px; font-family:'Fraunces',Georgia,serif; font-size:18px; color:#7B1818; font-weight:600; letter-spacing:-0.01em;">
            {{ title }}
        </h2>
        <p style="margin:0; font-size:14px; color:#3a4a3e; line-height:1.6;">
            {{ message }}
        </p>
    </div>

    <p style="margin:18px 0 0; font-size:14px; color:#5e6b61; line-height:1.5;">
        You can view this and other notifications by logging into the
        <a href="{{ site_url }}" style="color:#7B1818; font-weight:600; text-decoration:underline;">OJT Portal</a>.
    </p>

    <p style="margin:20px 0 0; font-size:14px; color:#1f2e24;">
        Best regards,<br>
        <strong style="color:#7B1818;">IC OJT Monitoring System</strong>
    </p>
{% endblock %}
