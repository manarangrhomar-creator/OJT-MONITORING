<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
</head>
<body style="margin:0; padding:0; background-color:#F7F5F0; font-family:-apple-system,BlinkMacSystemFont,'DM Sans',Arial,Helvetica,sans-serif;">
    <table role="presentation" cellpadding="0" cellspacing="0" style="width:100%; background-color:#F7F5F0;">
        <tr>
            <td align="center" style="padding:30px 15px;">
                <table role="presentation" cellpadding="0" cellspacing="0" style="max-width:600px; width:100%;">

                    <!-- Header -->
                    <tr>
                        <td align="center" style="background-color:#0F5436; padding:35px 20px;">
                            <img src="cid:isu_logo"
                                 alt="ISU Logo"
                                 style="width:72px; height:auto; display:block; margin:0 auto 14px;">
                            <h1 style="margin:0; font-family:'Fraunces',Georgia,serif; font-size:22px; color:#ffffff; font-weight:600; letter-spacing:-0.01em;">
                                Isabela State University
                            </h1>
                            <p style="margin:4px 0 0; font-size:13px; color:#a3c4af; font-weight:450; letter-spacing:0.02em;">
                                Cauayan City, Isabela
                            </p>
                            <p style="margin:10px 0 0; font-size:11px; color:#C8A44A; letter-spacing:0.08em; font-weight:500;">
                                OJT MONITORING SYSTEM
                            </p>
                        </td>
                    </tr>

                    <!-- Body -->
                    <tr>
                        <td style="background-color:#ffffff; padding:35px 30px; border-left:1px solid #e0dcd0; border-right:1px solid #e0dcd0;">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="background-color:#0F5436; padding:22px 30px; text-align:center;">
                            <p style="margin:0 0 2px; font-size:12px; color:#a3c4af; letter-spacing:0.02em;">
                                &copy; 2026 Isabela State University &mdash; Cauayan Campus
                            </p>
                            <p style="margin:4px 0 0; font-size:11px; color:#C8A44A; letter-spacing:0.06em; font-weight:500;">
                                OJT Monitoring System &bull; All Rights Reserved
                            </p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
