<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — ISU OJT Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="{% static 'images/isu_new_seal_512x512.png' %}" sizes="any" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/lucide@0.344.0"></script>
  <style>
    :root {
      --forest: #0F5436;
      --forest-light: #11693A;
      --gold: #C8A44A;
      --gold-light: #E5D09E;
      --paper: #F7F5F0;
      --charcoal: #1A1A1A;
      --font-display: 'Fraunces', Georgia, serif;
      --font-body: 'DM Sans', system-ui, sans-serif;
    }
    body {
      font-family: var(--font-body);
      background-color: var(--paper);
      color: var(--charcoal);
    }
    .grain::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      pointer-events: none;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-in > * {
      animation: fadeUp 0.7s ease-out both;
    }
    .animate-in > *:nth-child(1) { animation-delay: 0.1s; }
    .animate-in > *:nth-child(2) { animation-delay: 0.2s; }
    .animate-in > *:nth-child(3) { animation-delay: 0.35s; }
    .animate-in > *:nth-child(4) { animation-delay: 0.5s; }
    .bg-seal-wrap {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .bg-seal {
      position: absolute;
      right: 50px;
      top: 50%;
      transform: translateY(-50%);
      width: 500px;
      height: 500px;
      opacity: 0.04;
    }
    @media (max-width: 767px) {
      .bg-seal { width: 160px; height: 160px; right: 0; opacity: 0.025; }
    }
    .gold-link {
      position: relative;
      text-decoration: none;
    }
    .gold-link::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--gold);
      transition: width 0.3s ease;
    }
    .gold-link:hover::after {
      width: 100%;
    }
    .isu-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }
    .isu-loader .loader-logo-wrap {
      width: 112px;
      height: 112px;
      background: rgba(255,255,255,0.95);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .isu-loader .loader-logo-wrap img {
      width: 64px;
      height: 64px;
      object-fit: contain;
      animation: loaderPulse 1.5s ease-in-out infinite;
    }
    @keyframes loaderPulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.05); opacity: 1; }
    }
    .loader-progress {
      width: 200px;
      height: 4px;
      background: rgba(255,255,255,0.15);
      border-radius: 2px;
      overflow: hidden;
    }
    .loader-progress-bar {
      height: 100%;
      width: 100%;
      background: var(--gold);
      border-radius: 2px;
    }
    .loader-text {
      color: rgba(255,255,255,0.7);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.875rem;
      letter-spacing: 0.02em;
    }
    * { scrollbar-width: none; }
    *::-webkit-scrollbar { display: none; }
    .gold-divider {
      height: 1px;
      background: linear-gradient(90deg, var(--gold) 0%, transparent 100%);
    }
  </style>
</head>
<body class="grain min-h-screen flex items-center justify-center p-4 overflow-x-hidden">

  <div class="bg-seal-wrap">
    <img class="bg-seal" src="{% static 'images/isu_new_seal_512x512.png' %}" alt="" aria-hidden="true" />
  </div>

  <div id="loginLoadingMessage" class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm">
    <div class="isu-loader">
      <div class="loader-logo-wrap">
        <img src="{% static 'images/isu_new_seal_512x512.png' %}" alt="Loading" />
      </div>
      <div class="loader-progress">
        <div class="loader-progress-bar"></div>
      </div>
      <span class="loader-text">Signing in…</span>
    </div>
  </div>
<script nonce="{{ csp_nonce }}">(function(){var e=document.getElementById('loginLoadingMessage');if(!e)return;var b=e.querySelector('.loader-progress-bar');if(b){b.style.transformOrigin='left';var d=2000;var s=Date.now();var r=1;(function a(){if(!r||e.classList.contains('hidden'))return;var p=((Date.now()-s)%d)/d;var v=p<.5?p/.5*.85:.85*(1-(p-.5)/.5);b.style.transform='scaleX('+v+')';requestAnimationFrame(a)})();}window.addEventListener('load',function(){r=0;if(b){b.style.transition='transform 0.3s ease';b.style.transform='scaleX(1)'}setTimeout(function(){e.classList.add('hidden')},600)});})();</script>
  <div class="animate-in w-full max-w-4xl bg-white shadow-2xl overflow-hidden flex flex-col md:flex-row min-h-[520px] rounded-none" style="box-shadow: 0 20px 60px rgba(0,0,0,0.08);">

    <!-- Left panel — university branding -->
    <div class="w-full md:w-[38%] bg-[var(--forest)] flex flex-col md:flex-col items-center justify-center p-4 md:p-10 text-white relative">
      <div class="w-12 h-12 md:w-48 md:h-48 flex items-center justify-center mb-1 md:mb-6">
        <img src="{% static 'images/isu_new_seal_512x512.png' %}"
             alt="ISU Logo"
             class="w-full h-full object-contain" />
      </div>
      <h2 class="font-[var(--font-display)] text-sm md:text-2xl font-semibold text-center leading-tight md:leading-snug">
        OJT Monitoring System
      </h2>
      <div class="hidden md:block text-center">
        <p class="text-sm text-white/65 mt-2 text-center max-w-[220px]">
          Isabela State University — Cauayan Campus
        </p>
        <div class="mt-8 w-12 h-px bg-[var(--gold)]/50"></div>
        <p class="text-sm text-white/60 mt-6 mb-3">Don't have an account?</p>
        <a href="{% url 'student-register' %}"
           class="inline-block border border-white/40 text-white/90 hover:bg-white hover:text-[var(--forest)] rounded-full py-2.5 px-8 text-sm font-medium transition-all duration-300">
          Register here
        </a>
      </div>
    </div>

    <!-- Right panel — sign in form -->
    <div class="w-full md:w-[62%] p-8 md:p-14 relative flex flex-col justify-center">

      <a href="{% url 'home' %}"
         class="absolute top-8 left-8 md:top-6 md:left-6 w-10 h-10 hidden md:flex items-center justify-center rounded-full border border-[var(--charcoal)]/10 text-[var(--forest)] hover:bg-[var(--forest)] hover:text-white transition-all duration-300">
        <i data-lucide="chevron-left" class="w-5 h-5"></i>
      </a>

      <div class="max-w-sm mx-auto w-full">
        <span class="text-xs uppercase tracking-[0.2em] text-[var(--gold)] font-medium">Welcome back</span>
        <h1 class="font-[var(--font-display)] text-[var(--forest)] text-3xl md:text-4xl font-semibold mt-2 mb-10 leading-tight">
          Sign In
        </h1>

        <form id="loginForm" class="space-y-5">
          <div>
            <label for="loginIdentifier" class="text-sm font-medium text-[var(--charcoal)]/80 block mb-1.5">
              Username / Email / ID
            </label>
            <input type="text" id="loginIdentifier" required
                   class="w-full border border-[var(--charcoal)]/15 bg-[var(--paper)] rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-[var(--gold)] focus:ring-1 focus:ring-[var(--gold)] transition-all" />
          </div>

          <div>
            <label for="loginPassword" class="text-sm font-medium text-[var(--charcoal)]/80 block mb-1.5">
              Password
            </label>
            <div class="relative flex items-center">
              <input type="password" id="loginPassword" required
                     class="w-full border border-[var(--charcoal)]/15 bg-[var(--paper)] rounded-lg px-4 py-3 pr-12 text-sm focus:outline-none focus:border-[var(--gold)] focus:ring-1 focus:ring-[var(--gold)] transition-all" />
              <button type="button"
                      onclick="togglePasswordVisibility('loginPassword', 'loginEyeIcon')"
                      class="absolute right-3 text-[var(--charcoal)]/40 hover:text-[var(--forest)] transition-colors">
                <i id="loginEyeIcon" data-lucide="eye-off" class="w-5 h-5"></i>
              </button>
            </div>
          </div>

          <button type="submit"
                  class="w-full bg-[var(--forest)] text-white font-semibold py-3.5 rounded-full text-base hover:bg-[var(--forest-light)] transition-all duration-300 shadow-md hover:shadow-lg active:scale-[0.97] mt-2">
            Sign In
          </button>
        </form>

        <div class="mt-5 text-center">
          <a href="{% url 'forgotpassword' %}"
             class="text-sm text-[var(--charcoal)]/50 hover:text-[var(--forest)] transition-colors">
            Forgot password?
          </a>
        </div>

        <div class="md:hidden text-center mt-6">
          <p class="text-xs text-[var(--charcoal)]/50 mb-2">Don't have an account?</p>
          <a href="{% url 'student-register' %}" class="gold-link text-sm font-medium text-[var(--forest)]">Register here</a>
        </div>
        <div class="mt-6 md:mt-8 gold-divider"></div>
        <p class="text-xs text-[var(--charcoal)]/30 text-center mt-4">
          Isabela State University &middot; OJT Monitoring System v1.0
        </p>
      </div>
    </div>
  </div>

  <script src="/static/js/auth.js?v=4"></script>
  <script nonce="{{ csp_nonce }}">
    function togglePasswordVisibility(inputId, iconId) {
      const passwordInput = document.getElementById(inputId);
      const eyeIcon = document.getElementById(iconId);
      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        eyeIcon.setAttribute('data-lucide', 'eye');
      } else {
        passwordInput.type = "password";
        eyeIcon.setAttribute('data-lucide', 'eye-off');
      }
      lucide.createIcons();
    }

    function showToast(message) {
      Swal.fire({
        icon: 'error',
        title: message,
        toast: true,
        position: 'bottom-end',
        showConfirmButton: false,
        timer: 3000,
        timerProgressBar: true,
        customClass: { popup: 'rounded-xl' }
      });
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const identifier = document.getElementById('loginIdentifier').value;
      const password = document.getElementById('loginPassword').value;
      const loadingDiv = document.getElementById('loginLoadingMessage');
      const startTime = Date.now();
      loadingDiv.classList.remove('hidden');
      var pb_=loadingDiv.querySelector('.loader-progress-bar');
      try {
        const response = await login(identifier, password);
        const elapsed = Date.now() - startTime;
        const remaining = Math.max(0, 500 - elapsed);
        setTimeout(() => {
          if(pb_){pb_.style.transition='transform 0.3s ease';pb_.style.transform='scaleX(1)'}
          setTimeout(() => { redirectByRole(response.user.role); }, 300);
        }, remaining);
      } catch (error) {
        loadingDiv.classList.add('hidden');
        showToast(error.message || 'Login failed. Please check your credentials.');
      }
    });

    lucide.createIcons();
  </script>


</body>
</html>
